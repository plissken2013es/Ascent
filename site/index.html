<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ascent</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        margin: auto;
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        image-rendering: pixelated;
        cursor: pointer;
      }
      /* the choices, for keyboard focus and screen readers */
      nav {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="64" height="64"></canvas>
    <nav>
      <a href="pico8/">PICO-8 version</a>
      <a href="phaser4/">Phaser 4 version</a>
    </nav>
    <script type="module" src="./menu.js"></script>
  </body>
</html>
